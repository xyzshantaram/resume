name: build

# Every push to main rebuilds the PDFs and republishes the GitHub Pages copy, so
# xyzshantaram.github.io/resume is never stale. A tagged push does the same and
# also cuts a release, which is what the README links point at.
on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One Pages deployment at a time. Queue rather than cancel, so a tag build is
# never dropped in favour of a later push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # One build serves both outputs. A tag and a branch push run the same steps.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Builds the six PDFs and renders README.md into out/site/index.html.
      - name: Build
        run: make site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

      - name: Keep the PDFs for the release job
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: out/*.pdf
          retention-days: 1

  # The github-pages environment accepts a deployment only from main, so this
  # job is skipped on a tag. A tag always points at a commit that main already
  # published, so the site stays current either way.
  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Only a tag produces a release. The README links to
  # releases/latest/download/<name>.pdf, so this is what refreshes them.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the built PDFs
        uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.pdf \
            --repo "$REPO" \
            --title "$GITHUB_REF_NAME" \
            --notes "Built from ${GITHUB_SHA}."
