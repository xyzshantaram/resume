      observability and cheaper-workflow plugins.
  omnilua:
    name: omnilua
    url: github.com/ianm199/omnilua/issues/249
    note: >
      Found and fixed a garbage-collector memory leak in a pure-Rust Lua interpreter: allocations
      made with no active heap guard were linked onto no owner list, so nothing ever freed them.
      Roughly 29KB lost per VM. Fix merged upstream.
