    name: dsh-compaction-instant
    url: github.com/xyzshantaram/dsh-compaction-instant
    note: >
      Deterministic context compaction for coding agents: it compresses history in milliseconds
      with no model call and keeps the original tokens, never replacing them with a summary. I
      fixed checkpoints consuming each other and added per-tool retention.
  pideck:
    name: pideck
