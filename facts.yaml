projects:
  thursday:
    name: Thursday
    url: trythursday.org
    note: >
      Experiments in tailored software for people, enabled by AI: a hyperlocal,
      hyperfast feedback loop between users and developers, through the Internet.
    bullets:
      - >
        The person's intent is read back before anything happens; the first mismatch
        stops the work.
      - >
        The code is not the artifact, the person's thinking is.
      - >
        Shared terminology comes from a set of "verb" skills; situational awareness from
        visual memory and a standardized output format.
      - >
        Procedures encode human judgement so a tool can use it without replacing the
        person.
      - >
        A person and a machine use the same tools, the same state, and the same output.
      - >
        #link("https://trythursday.org/experiments/next-steps")[*Next Steps*] turns a goal
        into concrete steps, designed for a near-local model (Qwen3.8 Flash Next).
  thursday-dsh:
    name: Thursday (dsh)
    url: ""
    note: >
      An environment that gets more out of a cheap model: aidos supplies the ticket
      kernel and evidence gates, dotfiles-ai the observability and cheaper-workflow
      plugins, on DeepSeek Harness.
    bullets:
      - >
        aidos: only a human moves a ticket out of verification; evidence is a first-class
        row stamped with its author; gates are predicates over evidence.
      - >
        An agent cannot approve its own work or forge a human sign-off. Human and agent
        share one board.
      - >
        Turns model actions into computations: deterministic compaction with no model
        call, a bash guard that rewrites a wrong call, and a graph of each command chain
        and its exit codes.
      - >
        dotfiles-ai adds inline actions on tool calls, per-role model fallbacks, a unified
        subscription view, and more.
