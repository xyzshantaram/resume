# The single source of truth for every fact shared across the résumés.
#
# Edit a fact here once and every résumé that shows it updates on the next build.
# The .typ files keep only the per-résumé prose (the summary paragraph, section
# order, the skills block) and a list of which orgs, bullets, and projects to show.
#
# Two conventions:
#   * Bullets are written in Typst markup. `*bold*`, `#link("...")[...]`, and
#     backticks all work; lib/facts.typ renders them back to markup.
#   * A bullet is referenced by its id, so a typo in a résumé is a build error
#     rather than a missing line.
#
# Where the same fact was worded differently in two résumés, the merged entry
# names the résumés it came from. Where a fact is genuinely shaped for one role
# (the firmware bullets, `monorail`), it stays its own entry.

