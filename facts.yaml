      solo: >
        Designed, built, and sold an IoT product solo: enclosure CAD, a board I designed and
        fabricated, firmware, backend service, website, instruction leaflet, and packaging. Shipped
        to real customers with the hardware and firmware open-sourced.
      mechanical: >
        *Mechanical design.* Designed the chassis, lid, knob, and internal structure as parametric
        OpenSCAD models, using BOSL, MCAD, and `nutsnbolts` for fillets, rails, and bolt and
        heat-set-insert geometry. Named constants drive it, so one change propagates to the
        assembly.
      fixturing: >
        *Fixturing.* Designed a dedicated *assembly jig* for seating the rotary encoder repeatably,
        then revised it once the first version proved awkward on the bench. Rails, nubs, and snap
        features were dimensioned around fits measured off real parts.
      # merged from 03 and 04
      dfm: >
        *Design for manufacture.* Iterated the chassis across roughly *55 STL revisions* to v12 and
        a pre-production part. Ran print-parameter studies for layer height and surface roughness,
        then produced *batch plates for 1, 2, 5, and 9 parts* with slow-quality profiles for the
        production run.
      electronics: >
        *Electronics and firmware.* Designed the board in EasyEDA around an ESP-12F, a rotary
        encoder, and a MAX7219 LED matrix, and wrote the firmware in C++ on PlatformIO and Arduino,
        with LittleFS storage, a captive-portal Wi-Fi setup flow, and MIDI playback.
      everything-else: >
        *Everything else shipping requires.* Backend, website, an illustrated instruction booklet,
        and a packaging-layout generator. Sold to customers, with the hardware and design files
        open.
      whole-product-general: >
        One person, whole product: parametric OpenSCAD enclosure, a
        *#link("https://github.com/theattentionbutton")[board I designed and fabricated]*, the
        ESP8266 firmware, a backend service, the website, an illustrated instruction leaflet, and a
        packaging-layout generator. Sold to paying customers, with the design files open.

