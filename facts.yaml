  # Shown only on 02 and 04.
  earlier-freelance:
    title: Earlier freelance work
    company: Alongside study at VIT Chennai
    location: ""
    dates: "2019 — 2022"

  thursday:
    title: thursday — an environment that gets more out of a cheap model
    company: Built on DeepSeek Harness · aidos and dotfiles-ai · React/TS
    location: ""
    dates: "2026"
    bullets:
      aidos: >
        #link("https://github.com/xyzshantaram/aidos")[*aidos*], its ticket kernel, moves
        verification into the execution model: only a human moves a ticket out of verification,
        evidence is a first-class row stamped with its author, and gates are predicates over
        evidence. An agent cannot forge a human sign-off or mark its own work done.
      computation: >
        *Turns model actions into computations wherever it can.* Deterministic context compaction
        folds session history with no model call; a bash guard parses each command and rewrites a
        wrong call into the right one; a bash graph draws each command chain and its exit codes.
        #link("https://github.com/xyzshantaram/dotfiles-ai")[*dotfiles-ai*], the plugin bundle
        underneath, adds inline actions on tool calls, per-role model fallbacks, a unified
        subscription view, and more.

# Free-standing bullet runs, shown under a heading rather than a work entry.
lists:
  hardware:
    cardea: >
      *cardea* — Trezor Model One modified for USB-C and easy hand assembly.
    pideck: >
      #link("https://shantaram.xyz/misc/rev3_slides_final.pdf")[*pideck*] — a handheld modular
      computer and my final-year project: a carrier board integrating a Raspberry Pi Zero W, a
      3.5-inch LCD, a matrix keypad, TP4056 charging from an 18650, an MT3608 boost stage, and
      LM386 audio, drawing custom footprints for each module. Wrote the keyboard matrix driver in C
      against the Linux 6.1 kernel on Raspberry Pi OS, plus the launcher, a quiz app, and
      inter-device communication. Produced the full *BOM and cost analysis*: 3,931 INR per unit
      against a 3,325 INR budget, itemised to the resistor. Built three working units.
    programmer: >
      *CH340G USB programmer* — the production programmer I built to flash Attention Button units
      during assembly. Its header mates with one I designed onto the product board.
    signer-general: >
      *#link("https://github.com/xyzshantaram/hardware-signer")[Soapbox hardware signer]* —
      ESP32-WROVER-E with a 2.4-inch ILI9341/ST7789 TFT and a six-button pad with physical confirm
      and cancel, so each signature is approved on the device. I wrote its firmware as well.
    attention-board: >
      *#link("https://github.com/theattentionbutton")[The Attention Button]* — the board inside the
      product above: ESP-12F, a rotary encoder, a MAX7219 LED matrix, and a buzzer. 0805 passives
      chosen for hand assembly in small batches.

