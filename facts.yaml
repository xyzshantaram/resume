      Raspberry Pi Zero W, a 3.5-inch LCD, a matrix keypad, and boost and audio stages, with custom
      footprints for each module. I wrote the keyboard matrix driver in C against Linux 6.1, plus
      the #link("https://github.com/xyzshantaram/pideck-launcher")[launcher]. Full BOM and cost
      analysis, itemised to the resistor. Three working units.

