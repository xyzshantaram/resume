orgs:
  soapbox:
    title: Software Engineer (contract)
    company: Soapbox
    location: Remote
    dates: "Apr 2024 — Present"
    bullets:
      # Software-engineer résumé
      runtime: >
        Built a plugin runtime that runs third-party mini-apps in a client with no code change: a
        *19k-line Rust crate compiled to WebAssembly* behind a TypeScript embedding layer, consumed
        by three independent clients. I wrote the runtime, the plugin specification, and the Rust
        core; each plugin gets an isolated Lua engine and no DOM access.
      signing: >
        Moved capability enforcement out of host JavaScript into Rust, so grants are clamped on
        every write and revoking one takes effect inside the running worker. *Implemented NIP-46
        signing four ways* to prove it portable: a browser extension, a Rust desktop daemon, an
        ESP32 device I designed the board and firmware for, and a transport over LoRa mesh radio.
      agent-and-nostrify: >
        Built the plugin-authoring agent (*tile-studio*, then a reusable devkit in *Ditto*) whose
        `edit-code` tool addresses lines by *content hash* to keep edits token-efficient.
        Contributed to *Nostrify*: wrote the initial version of its Postgres storage adapter —
        protocol filters compiled to Kysely queries over postgres.js, with migrations and
        benchmarks — and worked around a Deno compatibility bug in postgres.js to get it running.
        Built SQLite- and LMDB-backed event stores, and migrated the Nostrify package graph off JSR
        onto npm.

      # Full-stack résumé
      canvases: >
        Shipped the #link("https://github.com/xyzshantaram/nostr-canvas")[*nostr-canvas*] plugin
        runtime in TypeScript and Rust, and clients built on it: *monorail*, a mobile-first React
        app with a marketplace and a social feed, and
        #link("https://github.com/xyzshantaram/tile-studio")[*tile-studio*], a browser IDE for
        authoring plugins, with a chat pane, a live sandboxed preview, and a publish pipeline.
      ditto: >
        Built that runtime into *Ditto v2*, a React and TypeScript client with a Capacitor shell:
        *117 commits* covering the embedding layer, a plugin marketplace, an install and permissions
        flow, and a threat model, plus the AI chat feature with its provider settings, session
        hooks, and tool system. Earlier I worked deeply on the Mastodon API in
        #link("https://github.com/xyzshantaram/ditto-v1")[*Ditto v1*], a Hono server.
      # merged from 02 and 04
      nostrify: >
        Contributed to #link("https://github.com/xyzshantaram/nostrify")[*Nostrify*], a core
        framework in Soapbox's Nostr tooling. I wrote the initial version of its Postgres storage
        adapter, compiling protocol filters to Kysely queries over postgres.js and setting up its
        migrations and benchmarks, and worked around a Deno compatibility bug in postgres.js to get
        it running. I also built SQLite- and LMDB-backed event stores, and migrated the Nostrify
        package graph off JSR onto npm so AI coding tools could resolve and build, and set up
        typechecking in CI.
      extension: >
        Shipped a browser extension with a permission UI and per-site grants, published to the
        #link("https://chromewebstore.google.com/detail/soapbox-signer/nnodjkgakfpkckcnbacpcjbpmlmbihdd")[*Chrome Web Store*]
        and #link("https://addons.mozilla.org/en-US/firefox/addon/soapbox-pub-signer/")[*Firefox Add-ons*].
      luacheck: >
        Ported #link("https://jsr.io/@xyzshantaram/luacheck-ts")[*luacheck-ts*], a 22k-line static
        analyzer, to TypeScript so it runs in the browser, Deno, and Node from one codebase.

      # Hardware résumé
      stack: >
        I write production Rust, C, C++, TypeScript, and Python. I have shipped a sandboxed runtime,
        a desktop daemon, and device firmware, so I build the tooling and the operator interface
        around a machine myself.
      lora: >
        #link("https://github.com/xyzshantaram/nostr-lora")[*nostr-lora*] — a specification and
        reference implementation carrying Nostr events over LoRa mesh radio, with a transport over
        Web Serial and Web Bluetooth.
      signer: >
        #link("https://github.com/xyzshantaram/hardware-signer")[*Soapbox hardware signer*] — an
        ESP32-WROVER-E NIP-46 signer with a 2.4-inch ILI9341/ST7789 TFT and a six-button pad with
        physical confirm and cancel, so each signature is approved on the device. I wrote its
        firmware too: display bring-up, on-device UI, Wi-Fi provisioning, and a scripting layer.

      # General résumé
      canvases-general: >
        *#link("https://github.com/xyzshantaram/nostr-canvas")[nostr-canvas]* lets any compatible
        client run third-party mini-apps with no client-side code change. Plugins are sandboxed Lua
        programs published as Nostr events, and the same plugin renders in monorail, tile-studio,
        and Ditto, three independent clients that share no UI code. I wrote the runtime, the plugin
        specification, and the Rust core.
      core: >
        The core is a *19k-line Rust crate* compiled to WebAssembly through `wasm-bindgen` and
        `tsify`, behind a TypeScript embedding layer and React components (26k lines) that hosts
        drop into their own applications. Every plugin gets an isolated Lua engine and no DOM
        access, so one plugin cannot crash another or reach the host.
      grants: >
        *Capability grants* gate fetch, event publishing, encryption, and Bitcoin signing. Rust
        enforces them, out of reach of the host's JavaScript, so revoking a grant takes effect
        inside the running worker. The specification carries an explicit dependency graph and three
        conformance levels.
      devkit: >
        Extracted the plugin-authoring agent into a reusable *nostr-canvas devkit* and integrated it
        into *Ditto*, a separate production client. Its `edit-code` tool addresses lines by *content
        hash* to keep edits token-efficient.
      signing-four: >
        Signing, across four surfaces: a
        *#link("https://github.com/xyzshantaram/soapbox-signer")[browser extension]* with per-site
        permissions and PSBT, Taproot, and BIP-375 silent payments;
        *#link("https://github.com/xyzshantaram/systray-signer")[traystr]*, a Rust desktop daemon
        keeping the key in the OS keyring;
        an *#link("https://github.com/xyzshantaram/hardware-signer")[ESP32 hardware signer]* I
        designed the board and firmware for; and
        *#link("https://github.com/xyzshantaram/nostr-lora")[NIP-LR]*, a specification and reference
        implementation carrying events over LoRa mesh radio.
      mastodon: >
        Worked deeply on the Mastodon API implementation in
        *#link("https://github.com/xyzshantaram/ditto-v1")[Ditto v1]*, a Hono server that speaks the
        Mastodon client API so existing apps work against it unchanged. Ditto v2 is a React and
        TypeScript single-page application.

  attention-button:
    # title and company merged from 02's short forms
    title: Founder and engineer
    company: The Attention Button — an IoT desk toy, designed and sold
    location: Bangalore
    dates: "2023 — 2025"
    bullets:
      whole-product: >
        One person, whole product: parametric CAD, a board I designed and fabricated, firmware, a
